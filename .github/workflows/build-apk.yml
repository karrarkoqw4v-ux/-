name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ccr-e1c59c96-ouzyav]
    paths: ["app/**", ".github/workflows/build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: app
        run: flutter create --platforms=android --org com.Jamaatkum --project-name app .

      - name: Add google-services.json (Firebase)
        working-directory: app
        run: cp google-services.json android/app/google-services.json

      - name: Apply google-services Gradle plugin
        working-directory: app
        run: |
          python3 - <<'PY'
          # في قوالب فلاتر الحديثة، إعلان الإضافات صار بملف settings.gradle.kts
          # (مو android/build.gradle.kts القديم) — نضيف إضافة google-services هناك.
          p = "android/settings.gradle.kts"
          s = open(p, encoding="utf-8").read()
          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  'id("dev.flutter.flutter-plugin-loader") version "1.0.0"',
                  'id("dev.flutter.flutter-plugin-loader") version "1.0.0"\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1,
              )
          open(p, "w", encoding="utf-8").write(s)

          p2 = "android/app/build.gradle.kts"
          s2 = open(p2, encoding="utf-8").read()
          if 'id("com.google.gms.google-services")' not in s2:
              s2 = s2.replace(
                  'id("dev.flutter.flutter-gradle-plugin")',
                  'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")',
                  1,
              )
          open(p2, "w", encoding="utf-8").write(s2)
          PY
          cat android/settings.gradle.kts
          echo "---"
          cat android/app/build.gradle.kts

      - name: Patch AndroidManifest (internet, notifications, crop screen, app name)
        working-directory: app
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if "POST_NOTIFICATIONS" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application', 1)
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          # بدل ما نخمّن القيمة المولّدة بالضبط (تعتمد على اسم المشروع)، نستبدل
          # أي قيمة android:label="..." بالاسم العربي — أضمن لو تغيّر اسم المشروع لاحقاً
          s = re.sub(r'android:label="[^"]*"', 'android:label="جماعتكم"', s, count=1)
          # windowOptOutEdgeToEdgeEnforcement يمنع شريط أزرار شاشة القص (موافق/إلغاء)
          # من الانزلاق تحت شريط الحالة واختفاءه على أجهزة أندرويد 15+
          crop = '<activity android:name="com.yalantis.ucrop.UCropActivity" android:screenOrientation="portrait" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:windowOptOutEdgeToEdgeEnforcement="true"/>'
          if "UCropActivity" not in s:
              s = s.replace("</application>", "    " + crop + "\n    </application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Enable core library desugaring (required by flutter_local_notifications)
        working-directory: app
        run: |
          python3 - <<'PY'
          p = "android/app/build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          if "isCoreLibraryDesugaringEnabled" not in s:
              s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
          if "coreLibraryDesugaring" not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          # نطفي فحص lint الإلزامي وقت البناء: هذي النسخة من أدوات أندرويد
          # فيها خلل داخلي معروف (lintVitalAnalyzeRelease يطيح بخطأ NoSuchMethodError)
          # ما له علاقة بكودنا، وتعطيله هو الحل المعتمد لحد ما تصدر نسخة مصلّحة.
          if "checkReleaseBuilds" not in s:
              s = s.replace("compileOptions {", 'lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n\n    compileOptions {', 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat android/app/build.gradle.kts

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jamaatkum-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
