name: Deploy Server to VPS

on:
  workflow_dispatch:
  push:
    branches: [ccr-9cee8c60-d1vffp]
    paths: ["host_server/**", ".github/workflows/deploy-server.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::أضف الأسرار VPS_HOST و VPS_SSH_KEY (و VPS_USER اختياري) في Settings > Secrets > Actions"
            exit 1
          fi

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName $VPS_HOST
            User ${VPS_USER:-root}
            Port ${VPS_PORT:-22}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          CFG

      - name: Upload server files
        run: |
          ssh vps "mkdir -p /opt/host-server"
          scp -r host_server/server.py host_server/Dockerfile host_server/deploy.sh \
                 host_server/base-requirements.txt host_server/base-node.txt vps:/opt/host-server/

      - name: Build and run (installs Docker + strong libraries automatically)
        run: ssh vps "cd /opt/host-server && bash deploy.sh"

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://$VPS_HOST:8080/health"; then echo; echo "SERVER OK"; exit 0; fi
            sleep 5
          done
          echo "::error::الخادم لا يستجيب على المنفذ 8080 — افتح المنفذ في جدار الحماية"
          exit 1
