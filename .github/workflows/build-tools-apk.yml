name: Build Tools APK

on:
  workflow_dispatch:
  push:
    branches: [ccr-9cee8c60-d1vffp]
    paths: ["tools_app/**", ".github/workflows/build-tools-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: tools_app
        run: flutter create --platforms=android --org com.toolbox --project-name tools_app .

      - name: Patch AndroidManifest (app name)
        working-directory: tools_app
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if "POST_NOTIFICATIONS" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application', 1)
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          # بدل ما نخمّن القيمة المولّدة بالضبط (تعتمد على اسم المشروع)، نستبدل
          # أي قيمة android:label="..." بالاسم العربي — أضمن لو تغيّر اسم المشروع لاحقاً
          s = re.sub(r'android:label="[^"]*"', 'android:label="صندوق الأدوات"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: tools_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-apk
          path: tools_app/build/app/outputs/flutter-apk/app-release.apk
