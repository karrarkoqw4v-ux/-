<!doctype html><html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden}
body{font-family:system-ui,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif;color:#fff;background:#000;position:relative}
#ph{position:absolute;inset:0;overflow:hidden;direction:rtl}
.st{position:absolute;top:0;left:0;right:0;height:34px;display:flex;justify-content:space-between;padding:10px 22px;font-size:13px;direction:ltr;z-index:30}
.glow{position:absolute;border-radius:50%;filter:blur(70px);transition:all .6s cubic-bezier(.22,1,.36,1)}
.g1{background:#B9B3D9;opacity:.35;width:300px;height:300px;top:-90px;right:-90px}
.g2{background:#25F4EE;opacity:.22;width:260px;height:260px;top:160px;left:-110px}
.g3{background:#9C7FD9;opacity:.18;width:240px;height:240px;top:420px;right:10px}
body.typing .g1{opacity:.55;width:340px;height:340px;top:-60px;right:-50px}
body.typing .g2{opacity:.4;width:320px;height:320px;top:90px;left:-80px}
body.typing .g3{opacity:.32;width:280px;height:280px;top:380px;right:-30px}
.logo{position:absolute;top:120px;left:0;right:0;display:flex;flex-direction:column;align-items:center;transition:all .35s cubic-bezier(.22,1,.36,1)}
body.typing .logo{top:60px;transform:scale(.7)}
.ic{width:64px;height:64px;border-radius:24px;background:#000;border:1px solid #ffffff22;display:grid;place-items:center;position:relative}
.ic i{position:absolute;font-style:normal}
.logo h1{font-size:24px;font-weight:800;margin-top:10px}
.card{position:absolute;left:0;right:0;bottom:0;border-radius:30px 30px 0 0;padding:24px 24px 22px;
  background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.14);transition:bottom .3s cubic-bezier(.22,1,.36,1)}
body.typing .card{bottom:0}
h2{font-size:18px;font-weight:800;margin-bottom:14px}
.fld{position:relative;margin-bottom:10px;transition:transform .18s ease-out}
.fld.focus{transform:scale(1.015)}
.fld .box{height:48px;border-radius:14px;background:#1F1E26;border:1.6px solid transparent;display:flex;align-items:center;gap:10px;padding:0 14px;transition:border-color .15s}
.fld.focus .box{border-color:#B9B3D9}
.fld span{color:#ffffffb3;font-size:14px;flex:1;direction:ltr;text-align:right}
.forgot{display:inline-block;padding:10px 0;font-size:13px;color:#B9B3D9;transition:transform .11s ease-out,opacity .11s}
.forgot:active{transform:scale(.96);opacity:.88}
.btn{height:48px;border-radius:14px;background:#B9B3D9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#1F1E26;
  box-shadow:0 8px 18px rgba(185,179,217,.28);margin-top:6px;transition:transform .11s ease-out,opacity .11s,box-shadow .11s;cursor:pointer}
.btn:active{transform:scale(.96);opacity:.88;box-shadow:0 3px 8px rgba(185,179,217,.2)}
.divider{height:1px;background:#ffffff1a;margin:22px 0}
.alt{display:flex;justify-content:center;gap:4px;font-size:13px;color:#ffffffb3}
.alt b{color:#B9B3D9;font-weight:700;padding:10px 6px;display:inline-block;transition:transform .11s ease-out}
.alt b:active{transform:scale(.94)}
.ripple{position:absolute;border-radius:50%;background:#ffffff33;transform:scale(0);animation:r .5s ease-out forwards;pointer-events:none}
@keyframes r{to{transform:scale(3);opacity:0}}
</style><body><div id="ph"></div><script>
const lg='<circle cx="22" cy="14" r="7"/><circle cx="9" cy="19" r="5"/><circle cx="35" cy="19" r="5"/><path d="M8 38c1-9 7-12 14-12s13 3 14 12z"/>';
document.getElementById('ph').innerHTML=`
<div class="st"><span>9:41</span><span>▂▄▆ 100%</span></div>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="logo"><div class="ic"><svg width="40" height="40" viewBox="0 0 44 44" style="overflow:visible"><g fill="#25F4EE" transform="translate(-2.2,-2.2)">${lg}</g><g fill="#B9B3D9" transform="translate(2.2,2.2)">${lg}</g><g fill="#fff">${lg}</g></svg></div><h1>جماعتكم</h1></div>
<div class="card">
  <h2>تسجيل الدخول</h2>
  <div class="fld" id="f1"><div class="box"><span id="emailTxt">البريد الإلكتروني</span>✉️</div></div>
  <div class="fld" id="f2"><div class="box"><span>كلمة السر</span>🔒</div></div>
  <a class="forgot">نسيت كلمة السر؟</a>
  <div class="btn" id="btn">دخول ومتابعة</div>
  <div class="divider"></div>
  <div class="alt">ما عندك حساب؟ <b>إنشاء حساب</b></div>
</div>`;
if(location.hash.includes('typing')) document.body.classList.add('typing');
if(location.hash.includes('focus1')) {document.getElementById('f1').classList.add('focus'); document.getElementById('emailTxt').textContent='karrar@example.com'; document.getElementById('emailTxt').style.color='#fff';}
if(location.hash.includes('pressed')) document.getElementById('btn').classList.add('pressed'); 
if(document.getElementById('btn').classList.contains('pressed')){const b=document.getElementById('btn');b.style.transform='scale(.96)';b.style.opacity='.88';b.style.boxShadow='0 3px 8px rgba(185,179,217,.2)';}
</script></body></html>
