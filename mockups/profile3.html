<!doctype html><html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html{width:390px;height:844px;overflow:hidden}
body{width:390px;height:844px;font-family:system-ui,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif;color:#fff;background:#000;position:relative;overflow:hidden}
#ph{position:absolute;inset:0;overflow:hidden;direction:rtl}
.st{position:absolute;top:0;left:0;right:0;height:34px;display:flex;justify-content:space-between;padding:10px 22px;font-size:13px;direction:ltr;z-index:9}
.g{position:absolute;border-radius:50%;filter:blur(90px)}
.lnk{color:#ffffffcc}
.av{border-radius:50%;background:linear-gradient(135deg,#ffb88c,#de6262);flex:none;position:relative}
.ring{padding:3px;border-radius:50%;background:conic-gradient(#FE2C55,#25F4EE,#FE2C55);flex:none;position:relative}
.ring .av{border:3px solid #000}
.plus{position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:#25F4EE;border:3px solid #000;display:grid;place-items:center}
.glass{background:#ffffff12;border:1px solid #ffffff26;border-radius:26px;backdrop-filter:blur(12px)}
.ib{width:42px;height:42px;border-radius:50%;background:#ffffff1c;border:1px solid #ffffff22;display:grid;place-items:center;position:relative}
.bdg{position:absolute;top:-3px;left:-3px;min-width:18px;height:18px;border-radius:9px;background:#FE2C55;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #000}
.btn{height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14.500px;flex:none}
.pri{background:#FE2C55;box-shadow:0 8px 20px #FE2C5566}
.sec{background:#ffffff1f;border:1px solid #ffffff33}
.stat{text-align:center}.stat b{display:block;font-size:20px;font-weight:800}.stat span{font-size:12px;color:#ffffffcc}
.dv{width:1px;background:#ffffff26;align-self:stretch}
.hl{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;width:68px;font-weight:600}
.hl i{width:62px;height:62px;border-radius:50%;padding:3px;display:grid;place-items:center;font-style:normal}
.hl i b{width:100%;height:100%;border-radius:50%;display:block}
.pill{padding:8px 10px;border-radius:22px;font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center;white-space:nowrap;background:#ffffff1a;border:1px solid #ffffff1f}
.pill.on{background:#FE2C55;border-color:#FE2C55;box-shadow:0 6px 16px #FE2C5566}
.th{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:3/4.2}
.th em{color:#fff;position:absolute;bottom:6px;right:8px;font-style:normal;font-size:11.500px;font-weight:800;display:flex;gap:3px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;background:#ffffff1a;border:1px solid #ffffff22;font-size:12px;font-weight:700}
</style><body><div id="ph"></div><script>
const S=(d,s=22,c='#fff',w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const D={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',addu:'<circle cx="10" cy="8" r="4"/><path d="M2 21c1-5 4-7 8-7M18 8v6M15 11h6"/>',edit:'<path d="M4 20l1-5L17 3l4 4L9 19zM14 6l4 4"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.500"/><rect x="14" y="3" width="7" height="7" rx="1.500"/><rect x="3" y="14" width="7" height="7" rx="1.500"/><rect x="14" y="14" width="7" height="7" rx="1.500"/>',heart:'<path d="M12 21s-8-5.200-8-11a4.600 4.600 0 018-3 4.600 4.600 0 018 3c0 5.800-8 11-8 11z"/>',save:'<path d="M6 3h12v18l-6-4-6 4z"/>',rep:'<path d="M4 11V9a3 3 0 013-3h11M15 3l3 3-3 3M20 13v2a3 3 0 01-3 3H6M9 21l-3-3 3-3"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',play:'<path d="M7 4l13 8-13 8z" fill="#fff"/>',plus:'<path d="M12 5v14M5 12h14"/>',wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M3 10h18"/>',share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',check:'<path d="M4 12l5 5 11-11"/>',bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/>',eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/>',cap:'<path d="M2 9l10-5 10 5-10 5zM6 11v5c0 1.500 3 3 6 3s6-1.500 6-3v-5"/>',star:'<path d="M12 3l2.800 5.800 6.200.9-4.500 4.400 1.100 6.200L12 17.300 6.400 20.300l1.100-6.200L3 9.700l6.200-.9z"/>'};
const st=`<div class="st"><span>9:41</span><span>▂▄▆ 100%</span></div>`;
const gl=`<div class="g" style="width:300px;height:300px;background:#FE2C55;opacity:.32;top:-90px;right:-90px"></div><div class="g" style="width:280px;height:280px;background:#25F4EE;opacity:.22;top:150px;left:-110px"></div>`;
const topbar=`<div style="display:flex;justify-content:space-between;align-items:center;padding:42px 16px 8px;position:relative;z-index:3"><div class="ib">${S(D.edit,20)}</div><div style="display:flex;gap:10px"><div class="ib">${S(D.bell,20)}<b class="bdg">٩+</b></div><div class="ib">${S(D.addu,20)}</div><div class="ib">${S(D.menu,20)}</div></div></div>`;
const grads=['#355c7d,#c06c84','#0f2027,#2c5364','#f09819,#ff512f','#4776E6,#8E54E9','#134e5e,#71b280','#833ab4,#fd1d1d'];
const views=['٣٢٣','١٢ ألف','٨٫٤ ألف'];
const th=n=>`<div class="th"><div style="position:absolute;inset:0;background:linear-gradient(160deg,${grads[n]})"></div><div style="position:absolute;inset:0;background:linear-gradient(#0000 55%,#000b)"></div><em>${S(D.play,11)}${views[n]}</em></div>`;
const hls=`<div style="display:flex;gap:6px;padding:0 14px">${[['+','جديد'],['b0','ببجي'],['b1','صور'],['b2','أفلام']].map(([p,t],n)=>`<div class="hl"><i style="${n==0?'border:2px dashed #ffffff66':'background:conic-gradient(#FE2C55,#25F4EE,#FE2C55)'}">${n==0?S(D.plus,26):`<b style="background:linear-gradient(135deg,${grads[n+2]});border:3px solid #000"></b>`}</i><span>${t}</span></div>`).join('')}</div>`;
const tabs=[['grid','فيديوهاتي','٢٤'],['rep','إعادة','٣'],['save','محفوظ','١٢'],['heart','إعجاب','٨٠']];
const bio=`<div style="font-size:13.500px;line-height:1.7;color:#fff">طالب ثالث، أحب الفيديوهات الهادية 🎬</div><div style="display:flex;gap:6px;margin-top:8px"><span class="chip">${S(D.cap,14,'#25F4EE')} الأمن السيبراني</span><span class="chip">${S(D.pin,14,'#FE2C55')} بغداد</span></div>`;
const nm=`<div style="font-size:21px;font-weight:800;display:flex;gap:7px;align-items:center">كرار علي حسن <span style="width:20px;height:20px;border-radius:50%;background:#25F4EE;display:grid;place-items:center">${S(D.check,12,'#000',3.500)}</span></div><div class="lnk" style="font-size:13.500px;margin-top:2px">@karrar_ali</div>`;
const stats=(ic)=>`<div style="display:flex;padding:12px 4px;border-radius:18px;background:#00000040;margin:14px 0">${[['٤٬٦٢٩','أتابعه'],['٤٬٥٧٠','متابعين'],['٥٬١٠١','إعجابات']].map(([n,t],i)=>(i?'<div class="dv"></div>':'')+`<div class="stat" style="flex:1"><b>${n}</b><span>${t}</span></div>`).join('')}</div>`;
const V={
A:`${st}${gl}${topbar}<div style="padding:6px 16px 0;position:relative"><div class="glass" style="padding:18px"><div style="display:flex;gap:14px;align-items:center"><div class="ring"><div class="av" style="width:84px;height:84px"></div><div class="plus">${S(D.plus,14,'#000',3.500)}</div></div><div>${nm}</div></div>${stats()}${bio}<div style="display:flex;gap:8px;margin-top:16px"><div class="btn pri" style="flex:1.4">${S(D.edit,18)} تعديل الملف</div><div class="btn sec" style="flex:1">${S(D.wallet,18)} الرصيد</div><div class="btn sec" style="width:46px">${S(D.share,18)}</div></div></div></div><div style="height:16px"></div>${hls}<div style="display:flex;gap:6px;padding:16px 14px 12px;overflow:hidden">${tabs.map(([k,t,n],i)=>`<span class="pill ${i?'':'on'}">${S(D[k],16)} ${t}</span>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px">${[0,1,2].map(th).join('')}</div>`,
B:`${st}${gl}${topbar}<div style="padding:56px 16px 0;position:relative;margin-top:14px"><div class="glass" style="padding:60px 16px 16px;text-align:center"><div style="position:absolute;top:-54px;left:0;right:0;display:flex;justify-content:center"><div class="ring"><div class="av" style="width:104px;height:104px"></div><div class="plus">${S(D.plus,14,'#000',3.500)}</div></div></div><div style="display:flex;flex-direction:column;align-items:center"><div style="font-size:22px;font-weight:800;display:flex;gap:7px;align-items:center">كرار علي حسن <span style="width:20px;height:20px;border-radius:50%;background:#25F4EE;display:grid;place-items:center">${S(D.check,12,'#000',3.500)}</span></div><div class="lnk" style="font-size:13.500px;margin:2px 0 8px">@karrar_ali</div><div style="font-size:13.500px;line-height:1.6;margin-bottom:8px">طالب ثالث، أحب الفيديوهات الهادية 🎬</div></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px">${[['user','٤٬٦٢٩','أتابعه'],['user','٤٬٥٧٠','متابعين'],['heart','٥٬١٠١','إعجابات']].map(([k,n,t],i)=>`<div style="background:#00000045;border:1px solid #ffffff1c;border-radius:16px;padding:10px 4px" class="stat"><b>${n}</b><span>${t}</span></div>`).join('')}</div><div style="display:flex;gap:8px"><div class="btn pri" style="flex:1">${S(D.edit,18)} تعديل الملف</div><div class="btn sec" style="flex:1">${S(D.wallet,18)} الرصيد</div></div></div></div><div style="height:14px"></div>${hls}<div style="display:flex;border-bottom:1px solid #ffffff22;margin-top:14px">${tabs.map(([k,t],i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font-size:11px;font-weight:700;${i?'opacity:.6':'border-bottom:3px solid #FE2C55'}">${S(D[k],21)}${t}</div>`).join('')}</div>`,
C:`${st}${gl}${topbar}<div style="padding:4px 16px 0;position:relative"><div class="glass" style="overflow:hidden"><div style="height:84px;background:linear-gradient(120deg,#FE2C55aa,#25F4EE88)"></div><div style="padding:0 18px 18px"><div style="display:flex;align-items:flex-end;gap:14px;margin-top:-38px"><div class="ring"><div class="av" style="width:84px;height:84px"></div><div class="plus">${S(D.plus,14,'#000',3.500)}</div></div><div style="padding-bottom:4px;flex:1"><div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><span class="chip" style="background:#FE2C55;border-color:#FE2C55">${S(D.star,13,'#fff',2.500)} مستوى ٧</span></div></div></div><div style="margin-top:10px">${nm}</div><div style="margin-top:10px">${bio}</div>${stats()}<div style="display:flex;gap:8px"><div class="btn pri" style="flex:1.3">${S(D.edit,18)} تعديل الملف</div><div class="btn sec" style="flex:1;flex-direction:column;gap:0;line-height:1.2;font-size:13px">الرصيد<span style="font-size:11px;color:#25F4EE">١٢٠ نقطة</span></div><div class="btn sec" style="width:46px">${S(D.share,18)}</div></div></div></div><div style="height:14px"></div>${hls}`,
D:`${st}${gl}${topbar}<div style="padding:4px 16px 0;position:relative"><div class="glass" style="padding:16px;display:flex;gap:14px;align-items:center"><div class="ring"><div class="av" style="width:78px;height:78px"></div><div class="plus">${S(D.plus,14,'#000',3.500)}</div></div><div style="flex:1">${nm}<div style="margin-top:8px;font-size:13px;line-height:1.6">طالب ثالث، أحب الفيديوهات الهادية 🎬</div></div></div>
<div class="glass" style="padding:14px;margin-top:10px"><div style="display:flex;padding:4px 0 14px">${[['٤٬٦٢٩','أتابعه'],['٤٬٥٧٠','متابعين'],['٥٬١٠١','إعجابات']].map(([n,t],i)=>(i?'<div class="dv"></div>':'')+`<div class="stat" style="flex:1"><b>${n}</b><span>${t}</span></div>`).join('')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[['edit','تعديل الملف','pri'],['wallet','الرصيد','sec'],['share','مشاركة الملف','sec'],['gear','الإعدادات','sec']].map(([k,t,c])=>`<div class="btn ${c}" style="height:50px">${S(D[k],19)} ${t}</div>`).join('')}</div></div></div><div style="height:14px"></div>${hls}<div style="display:flex;gap:6px;padding:14px 14px 0;overflow:hidden">${tabs.map(([k,t],i)=>`<span class="pill ${i?'':'on'}">${S(D[k],16)} ${t}</span>`).join('')}</div>`,
};
document.getElementById('ph').innerHTML=V[location.hash.slice(1)];
</script></body></html>
