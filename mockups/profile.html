<!doctype html><html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html{width:390px;height:844px;overflow:hidden}
body{width:390px;height:844px;font-family:system-ui,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif;color:#fff;background:#000;position:relative;overflow:hidden}
#ph{position:absolute;inset:0;overflow:hidden;direction:rtl}
.st{position:absolute;top:0;left:0;right:0;height:34px;display:flex;justify-content:space-between;padding:10px 22px;font-size:13px;direction:ltr;z-index:9}
.lnk{color:#ffffffb3}.red{color:#FE2C55}
.av{border-radius:50%;background:linear-gradient(135deg,#ffb88c,#de6262);position:relative;flex:none}
.plus{position:absolute;bottom:2px;right:2px;width:26px;height:26px;border-radius:50%;background:#25F4EE;border:3px solid #000;display:grid;place-items:center}
.btn{height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;padding:0 18px}
.pri{background:#FE2C55}.sec{background:#ffffff1a}
.stat b{display:block;font-size:19px;font-weight:800}.stat span{font-size:12px;color:#ffffffb3}
.hl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;width:66px}
.hl i{width:58px;height:58px;border-radius:50%;border:2px solid #ffffff33;display:grid;place-items:center;font-style:normal;overflow:hidden;padding:3px}
.hl i b{width:100%;height:100%;border-radius:50%;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.th{position:relative;aspect-ratio:3/4.2;overflow:hidden}
.th em{color:#fff;position:absolute;bottom:5px;right:7px;font-style:normal;font-size:11px;font-weight:700;display:flex;gap:3px;align-items:center;text-shadow:0 1px 4px #000}
.tabs{display:flex;justify-content:space-around;border-bottom:1px solid #ffffff14}
.tabs i{padding:11px 0;flex:1;display:grid;place-items:center;opacity:.55}.tabs i.on{opacity:1;border-bottom:2px solid #fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff33;border-radius:20px;padding:6px 12px;font-size:13px}
.light{background:#fff;color:#161823}.light .lnk{color:#161823a0}.light .sec{background:#F1F1F2}.light .stat span{color:#161823a0}.light .tabs,.light .chip{border-color:#1618231f}.light .plus,.light .av{}.light .hl i{border-color:#1618232a}
</style><body><div id="ph"></div><script>
const S=(d,s=22,c='#fff',w=1.9)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const D={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',addu:'<circle cx="10" cy="8" r="4"/><path d="M2 21c1-5 4-7 8-7M18 8v6M15 11h6"/>',edit:'<path d="M4 20l1-5L17 3l4 4L9 19zM14 6l4 4"/>',grid:'<path d="M9 4v16M15 4v16M3 4v16M21 4v16" stroke-width="2.500"/>',heart:'<path d="M12 21s-8-5.200-8-11a4.600 4.600 0 018-3 4.600 4.600 0 018 3c0 5.800-8 11-8 11z"/>',save:'<path d="M6 3h12v18l-6-4-6 4z"/>',rep:'<path d="M4 11V9a3 3 0 013-3h11M15 3l3 3-3 3M20 13v2a3 3 0 01-3 3H6M9 21l-3-3 3-3"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',play:'<path d="M7 4l13 8-13 8z" fill="#fff"/>',plus:'<path d="M12 5v14M5 12h14"/>',wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M3 10h18"/>',share:'<path d="M21 3L3 10l7 3 3 7z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',check:'<path d="M4 12l5 5 11-11"/>'};
const st=`<div class="st"><span>9:41</span><span>▂▄▆ 100%</span></div>`;
const bar=(l=true)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:44px 18px 6px;position:relative;z-index:3"><div style="display:flex;gap:16px">${S(D.edit,24)}</div><div style="display:flex;gap:16px">${S(D.addu,24)}${S(D.menu,24)}</div></div>`;
const grads=['#355c7d,#c06c84','#0f2027,#2c5364','#f09819,#ff512f','#4776E6,#8E54E9','#134e5e,#71b280','#833ab4,#fd1d1d','#232526,#414345','#FE2C55,#25F4EE','#ff9a9e,#fad0c4'];
const views=['٣٢٣','١٢ ألف','٨٫٤ ألف','٩٠٢','٤٥ ألف','٢١٠','١٫٢ ألف','٦٧٠','٣٣ ألف'];
const th=(n,asp)=>`<div class="th" ${asp?`style="aspect-ratio:${asp};border-radius:14px"`:''}><div style="position:absolute;inset:0;background:linear-gradient(160deg,${grads[n]})"></div><div style="position:absolute;inset:0;background:linear-gradient(#0000 55%,#000b)"></div><em>${S(D.play,11,'#fff')}${views[n]}</em></div>`;
const tabs=(on=0)=>`<div class="tabs">${['grid','lock','rep','save','heart'].map((k,n)=>`<i class="${n==on?'on':''}">${S(D[k],22)}</i>`).join('')}</div>`;
const hls=`<div style="display:flex;gap:10px;padding:0 18px">${[['+','جديد',0],['','ببجي',1],['','صور',2],['','أفلام',3]].map(([p,t,n])=>`<div class="hl"><i>${p?S(D.plus,26):`<b style="background:linear-gradient(135deg,${grads[n+3]})"></b>`}</i><span>${t}</span></div>`).join('')}</div>`;
const stats=(a)=>`<div style="display:flex;gap:${a||26}px">${[['٤٬٦٢٩','أتابعه'],['٤٬٥٧٠','متابعين'],['٥٬١٠١','إعجابات']].map(([n,t])=>`<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('')}</div>`;
const bio=`<div style="font-size:13.5px;line-height:1.7;color:#ffffffe6">طالب ثالث، أحب الفيديوهات الهادية 🎬<br>القسم: الأمن السيبراني</div>`;
const V={
P1:`${st}${bar()}<div style="display:flex;flex-direction:column;align-items:center;padding:6px 18px 0"><div class="av" style="width:96px;height:96px;border:3px solid #FE2C55;box-shadow:0 0 0 3px #000,0 0 24px #FE2C5577"><div class="plus">${S(D.plus,14,'#000',3)}</div></div><div style="font-size:21px;font-weight:800;margin-top:12px">كرار علي حسن</div><div class="lnk" style="font-size:13px;margin:2px 0 16px">@karrar_ali</div>${stats(34)}<div style="display:flex;gap:8px;margin:18px 0 14px;width:100%"><div class="btn pri" style="flex:1">متابعة</div><div class="btn sec" style="flex:1">رسالة</div><div class="btn sec" style="padding:0 12px">${S(D.share,18)}</div></div><div style="text-align:center">${bio}</div><div style="margin:12px 0 16px"><span class="chip">${S(D.wallet,16,'#FE2C55')} الرصيد</span></div></div>${hls}<div style="height:14px"></div>${tabs()}<div class="grid">${[0,1,2,3,4,5].map(n=>th(n)).join('')}</div>`,
P2:`${st}<div style="position:absolute;top:0;left:0;right:0;height:210px;background:radial-gradient(circle at 80% 0,#FE2C55cc,transparent 60%),radial-gradient(circle at 10% 90%,#25F4EEaa,transparent 55%),#0b0b0e"></div>${bar()}<div style="position:absolute;top:150px;left:0;right:0;padding:0 18px"><div style="display:flex;align-items:flex-end;gap:14px"><div class="av" style="width:92px;height:92px;border:4px solid #000"><div class="plus">${S(D.plus,14,'#000',3)}</div></div><div style="padding-bottom:6px"><div style="font-size:21px;font-weight:800">كرار علي حسن</div><div class="lnk" style="font-size:13px">@karrar_ali</div></div></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 14px">${[['٤٬٦٢٩','أتابعه'],['٤٬٥٧٠','متابعين'],['٥٬١٠١','إعجابات']].map(([n,t])=>`<div style="background:#16161a;border:1px solid #ffffff14;border-radius:16px;padding:12px;text-align:center" class="stat"><b>${n}</b><span>${t}</span></div>`).join('')}</div>${bio}<div style="display:flex;gap:8px;margin:14px 0"><div class="btn pri" style="flex:1">تعديل الملف</div><div class="btn sec" style="flex:1">${S(D.wallet,16)} الرصيد</div></div></div>
<div style="position:absolute;top:490px;left:0;right:0">${hls}<div style="height:12px"></div>${tabs()}<div class="grid">${[0,1,2].map(n=>th(n)).join('')}</div></div>`,
P3:`${st}<div style="position:absolute;width:300px;height:300px;border-radius:50%;background:#FE2C55;opacity:.3;filter:blur(90px);top:-80px;right:-80px"></div><div style="position:absolute;width:260px;height:260px;border-radius:50%;background:#25F4EE;opacity:.2;filter:blur(90px);top:120px;left:-90px"></div>${bar()}<div style="padding:8px 18px 0;position:relative"><div style="background:#ffffff0d;border:1px solid #ffffff1c;border-radius:26px;padding:18px;backdrop-filter:blur(10px)"><div style="display:flex;gap:14px;align-items:center"><div style="padding:3px;border-radius:50%;background:conic-gradient(#FE2C55,#25F4EE,#FE2C55)"><div class="av" style="width:84px;height:84px;border:3px solid #000"></div></div><div style="flex:1"><div style="font-size:20px;font-weight:800;display:flex;gap:6px;align-items:center">كرار علي حسن <span style="width:18px;height:18px;border-radius:50%;background:#25F4EE;display:grid;place-items:center">${S(D.check,11,'#000',3.5)}</span></div><div class="lnk" style="font-size:13px">@karrar_ali</div></div></div><div style="display:flex;justify-content:space-between;margin:16px 4px 14px">${[['٤٬٦٢٩','أتابعه'],['٤٬٥٧٠','متابعين'],['٥٬١٠١','إعجابات']].map(([n,t])=>`<div class="stat" style="text-align:center"><b>${n}</b><span>${t}</span></div>`).join('')}</div>${bio}<div style="display:flex;gap:8px;margin-top:14px"><div class="btn pri" style="flex:1">تعديل الملف</div><div class="btn sec" style="flex:1">${S(D.wallet,16)} الرصيد</div></div></div></div><div style="padding:16px 0 0">${hls}</div><div style="display:flex;gap:8px;padding:16px 18px 12px">${['فيديوهاتي','إعادة النشر','المحفوظ','الإعجابات'].map((t,n)=>`<span style="padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;background:${n?'#ffffff14':'#FE2C55'}">${t}</span>`).join('')}</div><div class="grid" style="padding:0 18px;gap:8px">${[0,1,2].map(n=>th(n,'3/4.2')).join('')}</div>`,
P4:`${st}${bar()}<div style="padding:8px 18px 0"><div style="display:flex;gap:16px;align-items:center"><div class="av" style="width:88px;height:88px"><div class="plus">${S(D.plus,14,'#000',3)}</div></div><div><div style="font-size:23px;font-weight:800">كرار علي حسن</div><div class="lnk" style="font-size:13px;margin-bottom:10px">@karrar_ali</div><div style="display:flex;align-items:center;gap:10px;font-size:13px"><span><b style="font-size:16px">٤٬٦٢٩</b> <span class="lnk">أتابعه</span></span><i style="width:3px;height:3px;border-radius:50%;background:#ffffff66"></i><span><b style="font-size:16px">٤٬٥٧٠</b> <span class="lnk">متابعين</span></span></div></div></div><div style="margin:16px 0 14px">${bio}</div><div style="display:flex;gap:8px;align-items:center"><div class="btn pri" style="flex:1">تعديل الملف</div><span class="chip" style="height:40px">${S(D.wallet,16,'#FE2C55')} الرصيد</span><div class="btn sec" style="padding:0 12px">${S(D.gear,18)}</div></div></div><div style="height:18px"></div>${hls}<div style="margin:16px 18px 12px;background:#16161a;border-radius:14px;padding:4px;display:flex">${['الفيديوهات','الإعادة','المحفوظ'].map((t,n)=>`<span style="flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:13px;font-weight:700;background:${n?'transparent':'#FE2C55'};color:${n?'#ffffffb3':'#fff'}">${t}</span>`).join('')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px">${[0,1].map(n=>th(n,'3/4')).join('')}</div>`,
P5:`<div class="light" style="position:absolute;inset:0;background:#fff"><div style="color:#161823">${st.replace('class="st"','class="st" style="color:#111"')}<div style="display:flex;justify-content:space-between;padding:44px 18px 6px"><div>${S(D.edit,24,'#161823')}</div><div style="display:flex;gap:16px">${S(D.addu,24,'#161823')}${S(D.menu,24,'#161823')}</div></div><div style="display:flex;flex-direction:column;align-items:center;padding:6px 18px 0"><div class="av" style="width:96px;height:96px;border:3px solid #FE2C55"><div class="plus" style="border-color:#fff">${S(D.plus,14,'#000',3)}</div></div><div style="font-size:21px;font-weight:800;margin-top:12px">كرار علي حسن</div><div class="lnk" style="font-size:13px;margin:2px 0 16px">@karrar_ali</div>${stats(34)}<div style="display:flex;gap:8px;margin:18px 0 14px;width:100%"><div class="btn pri" style="flex:1;color:#fff">تعديل الملف</div><div class="btn sec" style="flex:1">${S(D.wallet,16,'#161823')} الرصيد</div></div><div style="text-align:center;color:#161823;font-size:13.5px;line-height:1.7">طالب ثالث، أحب الفيديوهات الهادية 🎬<br>القسم: الأمن السيبراني</div></div><div style="height:16px"></div><div style="display:flex;gap:10px;padding:0 18px">${[['+','جديد',0],['','ببجي',1],['','صور',2],['','أفلام',3]].map(([p,t,n])=>`<div class="hl"><i>${p?S(D.plus,26,'#161823'):`<b style="background:linear-gradient(135deg,${grads[n+3]})"></b>`}</i><span>${t}</span></div>`).join('')}</div><div style="height:14px"></div><div class="tabs">${['grid','lock','rep','save','heart'].map((k,n)=>`<i class="${n==0?'on':''}" style="${n==0?'border-color:#161823':''}">${S(D[k],22,'#161823')}</i>`).join('')}</div><div class="grid">${[0,1,2].map(n=>th(n)).join('')}</div></div></div>`,
};
document.getElementById('ph').innerHTML=V[location.hash.slice(1)];
</script></body></html>
