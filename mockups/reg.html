<!doctype html><html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html{width:390px;height:844px;overflow:hidden}
body{width:390px;height:844px;font-family:system-ui,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif;color:#fff;background:#000;position:relative;overflow:hidden}
#ph{position:absolute;inset:0;overflow:hidden;direction:rtl}
.st{position:absolute;top:0;left:0;right:0;height:34px;display:flex;justify-content:space-between;padding:10px 22px;font-size:13px;direction:ltr;z-index:9}
.scr{position:absolute;inset:0;padding:56px 24px 20px;display:flex;flex-direction:column}
.fld{height:48px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;margin-bottom:9px;font-size:14px;background:#1F1F23;color:#ffffffb3;border:1.5px solid transparent;flex:none}
.fld span{flex:1}.fld.v{color:#fff}.fld.ok{border-color:#3ddc97}.fld.er{border-color:#FFB84D}
.h{font-size:12px;margin:-5px 6px 8px}.h.o{color:#3ddc97}.h.e{color:#FFB84D}
.btn{height:48px;border-radius:14px;background:#FE2C55;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.lnk{font-size:13px;color:#ffffffb3}.red{color:#FE2C55;font-weight:700}
.glow{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(90px)}
.av{position:relative;flex:none}.av .c{border-radius:50%;background:#1F1F23;display:grid;place-items:center;overflow:hidden;border:2px dashed #FE2C5599}
.av .c.p{border:2px solid #FE2C55}.av .cm{position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:#FE2C55;display:grid;place-items:center;border:3px solid #000}
.photo{width:100%;height:100%;background:linear-gradient(135deg,#ffb88c,#de6262)}
.light{background:#fff;color:#161823}.light .fld{background:#F1F1F2;color:#16182399}.light .fld.v{color:#161823}.light .lnk{color:#161823a0}
.prog{display:flex;gap:6px;margin:6px 0 22px}.prog i{flex:1;height:4px;border-radius:2px;background:#ffffff26}.prog i.on{background:#FE2C55}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;opacity:.5;transform:scale(1.15) rotate(-6deg)}.tiles i{border-radius:14px;height:230px}
.dim{position:absolute;inset:0;background:#0007}
.dlg{position:absolute;left:34px;right:34px;top:50%;transform:translateY(-50%);background:#232326;border-radius:28px;padding:24px 20px 14px;text-align:center}
.dlg .b{padding:14px;border-radius:14px;font-size:14px;font-weight:700}
</style><body><div id="ph"></div><script>
const S=(d,c='#ffffffb3')=>`<svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="${c}" stroke-width="1.8">${d}</svg>`;
const D={mail:'<rect x="2" y="4" width="18" height="14" rx="3"/><path d="M3 6l8 6 8-6"/>',lock:'<rect x="4" y="10" width="14" height="9" rx="2"/><path d="M7 10V7a4 4 0 018 0v3"/>',eye:'<path d="M1 11s4-7 10-7 10 7 10 7-4 7-10 7S1 11 1 11z"/><circle cx="11" cy="11" r="3"/>',at:'<circle cx="11" cy="11" r="4"/><path d="M15 11v2a3 3 0 006 0v-2a10 10 0 10-4 8"/>',badge:'<rect x="2" y="4" width="18" height="14" rx="3"/><circle cx="8" cy="10" r="2"/><path d="M13 9h4M13 13h4M5 15c1-2 5-2 6 0"/>',cam:'<path d="M2 5h3l2-2h4l2 2h3v10H2z"/><circle cx="9" cy="10" r="3"/>',img:'<rect x="2" y="3" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="2"/><path d="M3 17l6-6 4 4 3-3 4 4"/>',back:'<path d="M14 4l-7 7 7 7"/>',ok:'<circle cx="11" cy="11" r="9.5" fill="#3ddc97" stroke="none"/><path d="M6.5 11l3 3 6-6.5" stroke="#000" stroke-width="2.2"/>',no:'<circle cx="11" cy="11" r="9.5" fill="#FFB84D" stroke="none"/><path d="M7.5 7.5l7 7M14.5 7.5l-7 7" stroke="#000" stroke-width="2.2"/>'};
const i=(k,c)=>S(D[k],c);
const st=`<div class="st"><span>9:41</span><span>▂▄▆ 100%</span></div>`;
const person=s=>`<svg width="${s}" height="${s}" viewBox="0 0 56 56" fill="#ffffff66"><circle cx="28" cy="20" r="11"/><path d="M6 52c2-14 12-17 22-17s20 3 22 17z"/></svg>`;
const av=(s,photo)=>`<div class="av" style="width:${s}px;height:${s}px"><div class="c ${photo?'p':''}" style="width:${s}px;height:${s}px">${photo?'<div class="photo"></div>':person(s*.5)}</div><div class="cm">${i('cam','#fff')}</div></div>`;
const F=(ic,t,o={})=>`<div class="fld ${o.v?'v':''} ${o.c||''}">${i(ic,o.ic)}<span ${o.ltr?'style="direction:ltr;text-align:right"':''}>${t}</span>${o.end||''}</div>${o.h||''}`;
// الحقول الأربعة في حالة "مكتملة" أو "فاضية"
const fields=(st='empty',ic)=>{
 if(st=='full')return F('badge','كرار علي حسن',{v:1,ic})+F('at','karrar_ali',{v:1,ltr:1,c:'ok',end:i('ok'),h:'<div class="h o">اسم المستخدم متاح ✓</div>',ic})+F('mail','karrar@example.com',{v:1,ltr:1,ic})+F('lock','••••••••••',{v:1,ltr:1,end:i('eye'),ic});
 if(st=='err')return F('badge','كرار علي',{v:1,c:'er',h:'<div class="h e">الاسم لازم يكون ثلاثي أو أكثر</div>',ic})+F('at','karrar',{v:1,ltr:1,c:'er',end:i('no'),h:'<div class="h e">اسم المستخدم مستخدم، جرّب غيره</div>',ic})+F('mail','karrar@example.com',{v:1,ltr:1,ic})+F('lock','••••••••••',{v:1,ltr:1,end:i('eye'),ic});
 return F('badge','الاسم الثلاثي',{ic})+F('at','اسم المستخدم (اليوزر)',{ic})+F('mail','بريدك الإلكتروني',{ic})+F('lock','كلمة السر (8 أحرف على الأقل)',{end:i('eye'),ic});
};
const glows=`<div class="glow" style="background:#25F4EE;opacity:.18;top:-130px;right:-110px"></div><div class="glow" style="background:#FE2C55;opacity:.28;bottom:-150px;left:-130px"></div>`;
const back=`<div class="lnk" style="text-align:center;margin-top:12px"><span class="red">رجوع لتسجيل الدخول</span></div>`;
const V={
R1:`${st}${glows}<div class="scr" style="align-items:stretch"><div style="text-align:center;font-size:22px;font-weight:800;margin:6px 0 14px">إنشاء حساب</div><div style="align-self:center">${av(92,1)}</div><div class="lnk" style="text-align:center;margin:6px 0 16px;font-size:12px">اضغط لاختيار صورتك</div>${fields('full')}<div class="btn" style="margin-top:4px">إنشاء ومتابعة</div>${back}</div>`,
R2:`${st}${glows}<div class="scr"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:38px;height:38px;border-radius:50%;background:#ffffff14;display:grid;place-items:center">${i('back','#fff')}</div><span class="lnk">الخطوة 1 من 3</span></div><div class="prog"><i class="on"></i><i></i><i></i></div><div style="font-size:24px;font-weight:800">وش اسمك وصورتك؟</div><div class="lnk" style="margin:6px 0 26px">عرّف جماعتك فيك</div><div style="align-self:center;margin-bottom:26px">${av(116,1)}</div>${F('badge','كرار علي حسن',{v:1})}<div class="lnk" style="font-size:12px;margin:0 6px">الاسم الثلاثي يظهر في ملفك</div><div style="flex:1"></div><div class="btn">التالي</div>${back}</div>`,
R3:`<div class="light" style="position:absolute;inset:0;background:#fff">${st}<div class="scr" style="color:#161823"><div style="text-align:center;font-size:22px;font-weight:800;margin:6px 0 14px">إنشاء حساب</div><div style="align-self:center">${av(92,1).replace('border:3px solid #000','border:3px solid #fff')}</div><div class="lnk" style="text-align:center;margin:6px 0 16px;font-size:12px">اضغط لاختيار صورتك</div>${fields('full','#16182399')}<div class="btn" style="margin-top:4px">إنشاء ومتابعة</div>${back}</div></div>`,
R4:`${st}<div class="tiles">${['#355c7d,#c06c84','#FE2C55,#25F4EE','#0f2027,#2c5364','#f09819,#ff512f','#4776E6,#8E54E9','#134e5e,#71b280','#833ab4,#fd1d1d','#232526,#414345','#ff9a9e,#fad0c4'].map(c=>`<i style="background:linear-gradient(160deg,${c})"></i>`).join('')}</div><div style="position:absolute;inset:0;background:linear-gradient(#000a,#000e)"></div>
<div style="position:absolute;left:18px;right:18px;top:96px;background:#0c0c0fe6;border:1px solid #ffffff1f;border-radius:28px;padding:62px 18px 18px"><div style="position:absolute;top:-46px;left:0;right:0;display:flex;justify-content:center">${av(92,1)}</div><div style="text-align:center;font-size:20px;font-weight:800;margin-bottom:14px">إنشاء حساب</div>${fields('full')}<div class="btn" style="margin-top:4px">إنشاء ومتابعة</div>${back}</div>`,
R5:`${st}<div class="scr" style="padding-top:70px"><div style="display:flex;align-items:center;gap:16px;margin-bottom:34px">${av(84,0)}<div><div style="font-size:26px;font-weight:800">حساب جديد</div><div class="lnk" style="margin-top:4px">أضف صورتك وكمّل بياناتك</div></div></div>
${['badge:كرار علي حسن','at:karrar_ali','mail:karrar@example.com','lock:••••••••••'].map((x,n)=>{const[k,t]=x.split(':');return `<div style="border-bottom:1.5px solid ${n==1?'#3ddc97':'#ffffff33'};padding:12px 2px;display:flex;align-items:center;gap:10px;margin-bottom:${n==1?6:20}px;font-size:15px">${i(k,n==1?'#3ddc97':'#ffffffb3')}<span style="flex:1;${n>0&&n<3?'direction:ltr;text-align:right':''}">${t}</span>${n==1?i('ok'):''}${n==3?i('eye'):''}</div>${n==1?'<div class="h o" style="margin:0 2px 18px">اسم المستخدم متاح ✓</div>':''}`}).join('')}
<div style="flex:1"></div><div class="btn" style="border-radius:30px">إنشاء ومتابعة</div>${back}</div>`,
R6:`${st}<div style="position:absolute;top:0;left:0;right:0;height:300px;-webkit-mask:linear-gradient(#000 60%,transparent);background:radial-gradient(circle at 80% 10%,#FE2C55aa,transparent 55%),radial-gradient(circle at 15% 70%,#25F4EE88,transparent 55%),#0a0a0c"></div>
<div style="position:absolute;top:70px;left:0;right:0;text-align:center;font-size:22px;font-weight:800">إنشاء حساب</div><div style="position:absolute;top:150px;left:0;right:0;display:flex;justify-content:center">${av(116,1).replace('border:3px solid #000','border:3px solid #000')}</div>
<div style="position:absolute;top:300px;left:0;right:0;bottom:0;padding:0 24px 22px;display:flex;flex-direction:column"><div class="lnk" style="text-align:center;font-size:12px;margin-bottom:12px">اضغط لتغيير الصورة</div>${fields('full')}<div style="flex:1"></div><div class="btn">إنشاء ومتابعة</div>${back}</div>`,
R7err:`${st}${glows}<div class="scr" style="align-items:stretch"><div style="text-align:center;font-size:22px;font-weight:800;margin:6px 0 14px">إنشاء حساب</div><div style="align-self:center">${av(92,1)}</div><div class="lnk" style="text-align:center;margin:6px 0 16px;font-size:12px">اضغط لاختيار صورتك</div>${fields('err')}<div class="btn" style="margin-top:4px">إنشاء ومتابعة</div>${back}</div>`,
/* أذونات */
P1:`${V_bg()}<div class="dim"></div><div class="dlg" style="background:#2a2a2e"><div style="width:52px;height:52px;border-radius:50%;background:#FE2C5522;display:grid;place-items:center;margin:0 auto 12px">${S(D.img,'#FE2C55')}</div><div style="font-size:16px;font-weight:800;margin-bottom:8px">السماح لجماعتكم بالوصول إلى الصور؟</div><div class="lnk" style="font-size:12.5px;line-height:1.6;margin-bottom:16px">نحتاجه عشان تختار صورة حسابك من جهازك. ما نشوف إلا اللي تختاره.</div><div style="display:flex;flex-direction:column;gap:4px"><div class="b" style="background:#FE2C55">السماح</div><div class="b" style="color:#ffffffb3">عدم السماح</div></div></div>`,
P2:`${V_bg()}<div class="dim"></div><div style="position:absolute;bottom:0;left:0;right:0;background:#1c1c1f;border-radius:28px 28px 0 0;padding:14px 24px 28px"><div style="width:42px;height:5px;border-radius:3px;background:#ffffff33;margin:0 auto 18px"></div><div style="font-size:18px;font-weight:800;margin-bottom:6px">اختر صورتك</div><div class="lnk" style="font-size:12.5px;margin-bottom:12px">جماعتكم يوصل بس للصورة اللي تختارها، مو كل صورك</div>
<div style="display:flex;align-items:center;gap:14px;padding:12px 2px;font-size:15px"><i style="width:44px;height:44px;border-radius:14px;background:#FE2C5522;display:grid;place-items:center">${S(D.img,'#FE2C55')}</i>اختيار من المعرض</div><div style="display:flex;align-items:center;gap:14px;padding:12px 2px;font-size:15px"><i style="width:44px;height:44px;border-radius:14px;background:#25F4EE22;display:grid;place-items:center">${S(D.cam,'#25F4EE')}</i>التقاط صورة بالكاميرا</div></div>`,
P3:`${st}${glows}<div class="scr" style="justify-content:center;align-items:center;text-align:center;padding:40px 30px"><div style="width:120px;height:120px;border-radius:50%;background:#1F1F23;display:grid;place-items:center;position:relative;margin-bottom:26px"><div style="position:absolute;inset:-10px;border-radius:50%;border:2px dashed #FE2C5566"></div>${S(D.img,'#FE2C55').replace('width="20" height="20"','width="54" height="54"')}</div><div style="font-size:22px;font-weight:800;margin-bottom:10px">نحتاج إذن الصور</div><div class="lnk" style="line-height:1.7;margin-bottom:30px">عشان تضيف صورة لحسابك لازم تسمح لجماعتكم بفتح المعرض.<br>ما راح نشوف أو نرفع إلا الصورة اللي تحددها.</div><div class="btn" style="width:100%">السماح بالوصول</div><div class="lnk" style="margin-top:16px">لاحقاً</div></div>`,
};
function V_bg(){return `${st}${glows}<div class="scr" style="align-items:stretch"><div style="text-align:center;font-size:22px;font-weight:800;margin:6px 0 14px">إنشاء حساب</div><div style="align-self:center">${av(92,0)}</div><div class="lnk" style="text-align:center;margin:6px 0 16px;font-size:12px">اضغط لاختيار صورتك</div>${fields('empty')}</div>`}
V.P1=V.P1;
document.getElementById('ph').innerHTML=V[location.hash.slice(1)];
</script></body></html>
